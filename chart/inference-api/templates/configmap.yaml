apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inference-api.fullname" . }}
  labels:
    {{- include "inference-api.labels" . | nindent 4 }}
data:
  MODEL_NAME: {{ .Values.app.config.modelName | quote }}
  RATE_LIMIT: {{ .Values.app.config.rateLimit | default 50 | quote }}
  DB_HOST: {{ .Values.config.database.host | quote }}
  DB_PORT: {{ .Values.config.database.port | quote }}
  DB_NAME: {{ .Values.config.database.name | quote }}
  DB_USER: {{ .Values.config.database.user | quote }}
