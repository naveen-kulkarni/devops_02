replicaCount: 3

image:
  repository: inference-api
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

app:
  port: 8080
  config:
    modelName: gen-small
    rateLimit: 200

config:
  database:
    host: postgres
    port: 5432
    name: inference
    user: inference
    passwordSecret: postgres

podAnnotations: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

terminationGracePeriodSeconds: 10

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: inference.local
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  dnsNamespace: kube-system
